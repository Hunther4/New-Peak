# fly.toml app configuration file generated for paesteseo
app = 'paesteseo'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  DATABASE_URL = 'sqlite:////data/peak.db'
  PYTHONUNBUFFERED = '1'
  PEAK_BETA_MODE = '1'
  DISABLE_DOCS = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'peak_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
