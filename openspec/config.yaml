    | `frontend` | Build        | ✅ | `pnpm build`  | succeeds |

rules:
  proposal:
    - "Include a rollback plan for risky changes."
    - "State which discovered project (backend, frontend, or both) each scope item touches."
    - "Reference the relevant spec domain under openspec/specs/."
  specs:
    - "Use Given/When/Then for scenarios."
    - "Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)."
    - "Tag every scenario with its owning project so verification can pick the right runner."
  design:
    - "Include sequence diagrams for complex flows."
    - "Document architecture decisions with rationale."
    - "Route all date/time logic through backend/core/timeutils.py — never call zoneinfo.ZoneInfo directly."
    - "State schema changes as a new numbered file in backend/migrations/ plus the runner update."
  tasks:
    - "Group by phase, use hierarchical numbering."
    - "Keep tasks completable in one session."
    - "Keep each work unit inside the 800-changed-line review budget."
    - "Attach the owning project's focused test command to every task."
    - "Never include a whole-repo format or lint sweep as a task."
  apply:
    guidelines:
      - "Follow existing code patterns."
      - "Touch only the files a task owns; never run a formatter over the whole repo."
      - "Preserve the pre-existing WIP working tree — never discard or revert unrelated changes."
    tdd: true
    test_command: "Per project — see projects[].test.focus_command (backend: `backend/venv/Scripts/python.exe -m pytest {file}`; frontend: `pnpm vitest run {file}`)."
  verify:
    test_command: "Per project — see projects[].test.command and projects[].coverage.command."
    build_command: "backend: `backend/venv/Scripts/python.exe -m pytest` (import check via the suite); frontend: `pnpm build`."
    coverage_threshold: 72
    coverage_thresholds_by_project:
      backend: 72
      frontend: { statements: 38, branches: 28, functions: 32, lines: 39 }
    notes:
      - "Do not gate verification on `pnpm lint`: it currently fails on pre-existing errors and is not CI-enforced."
      - "A pre-existing failing check must be reported as pre-existing, not silently fixed or attributed to the change."
  archive:
    - "Warn before merging destructive deltas."
    - "Merge delta specs into openspec/specs/{domain}/spec.md; never modify an archived change."
